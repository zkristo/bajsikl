server:
  host: 127.0.0.1
  port: 8080
osm: croatia.osm.pbf
timetable:
  first_day: TODAY
  num_days: 365
  tb: false
  railviz: true
  with_shapes: true
  adjust_footpaths: true
  merge_dupes_intra_src: false
  merge_dupes_inter_src: false
  link_stop_distance: 100
  update_interval: 60
  http_timeout: 30
  canned_rt: false
  incremental_rt_update: false
  extend_missing_footpaths: false
  max_footpath_length: 15
  default_transfer_time: 2
  max_matching_distance: 25.000000
  preprocess_max_matching_distance: 250.000000
  datasets:
    hzpp:
      path: hzpp.zip
      extend_calendar: false
      default_bikes_allowed: false
      default_cars_allowed: false
      default_reservation_not_required: true
      clasz_reservation_not_required:
        AIR: false
        COACH: false
        NIGHT: false
        ODM: false
        RIDESHARING: false
    zet:
      path: zet.zip
      rt:
        - url: https://www.zet.hr/gtfs-rt-protobuf
      extend_calendar: false
      default_bikes_allowed: false
      default_cars_allowed: false
      default_reservation_not_required: true
      clasz_reservation_not_required:
        AIR: false
        COACH: false
        NIGHT: false
        ODM: false
        RIDESHARING: false
elevators: false
street_routing: true
osr_footpath: true
geocoding: true
reverse_geocoding: true
gbfs:
  feeds:
    hr-bajs:
      url: https://gbfs.nextbike.net/maps/gbfs/v2/nextbike_hd/gbfs.json
